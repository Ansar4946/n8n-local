services:

  postgres:
    image: postgres:17
    container_name: n8n-postgres
    restart: always

    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8npassword
      POSTGRES_DB: n8n

    volumes:
      - postgres_data:/var/lib/postgresql/data


  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always

    ports:
      - "5678:5678"

    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8npassword

      GENERIC_TIMEZONE: Asia/Karachi
      N8N_SECURE_COOKIE: "false"

    volumes:
      - n8n_data:/home/node/.n8n


  playwright:
    build:
      context: ./playwright
      dockerfile: Dockerfile

    container_name: playwright
    restart: always

    ports:
      - "3000:3000"

    environment:
      RANKYTOOLS_USERNAME: ${RANKYTOOLS_USERNAME}
      RANKYTOOLS_PASSWORD: ${RANKYTOOLS_PASSWORD}


volumes:

  postgres_data:

  n8n_data: