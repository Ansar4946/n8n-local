services:

  postgres:
    image: postgres:17
    container_name: n8n-postgres
    restart: always

    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8npassword
      POSTGRES_DB: n8n

    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Explicit DNS — prevents NXDOMAIN / "incorrect host" errors
    dns:
      - 8.8.8.8
      - 1.1.1.1

    # Prevent log files from filling up the disk
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always

    ports:
      - "5678:5678"

    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8npassword

      GENERIC_TIMEZONE: Asia/Karachi
      N8N_SECURE_COOKIE: "false"

      # Helpful for external HTTP requests from inside the container
      N8N_DIAGNOSTICS_ENABLED: "false"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"

      # Optional but useful for Wikimedia/press-site requests
      N8N_DEFAULT_BINARY_DATA_MODE: "filesystem"

    volumes:
      - n8n_data:/home/node/.n8n

    dns:
      - 8.8.8.8
      - 1.1.1.1

    depends_on:
      - postgres

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  playwright:
    build:
      context: ./playwright
      dockerfile: Dockerfile

    container_name: playwright
    restart: always

    ports:
      - "3000:3000"

    environment:
      RANKYTOOLS_USERNAME: ${RANKYTOOLS_USERNAME}
      RANKYTOOLS_PASSWORD: ${RANKYTOOLS_PASSWORD}
      NODE_ENV: production
      PORT: 3000

    # Chromium needs shared memory; default 64MB causes random crashes
    shm_size: '2gb'

    dns:
      - 8.8.8.8
      - 1.1.1.1

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


volumes:
  postgres_data:
  n8n_data: